name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export-engine tests (real FFmpeg renders)
        shell: pwsh
        continue-on-error: true
        run: |
          npm test 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { $t = ((Get-Content test.log -Tail 25) -join '%0A'); Write-Host "::error title=Tests failed::$t"; exit $code }

      - name: Fetch offline speech engine (captions)
        run: pwsh -File scripts/fetch-whisper.ps1

      - name: Build installer
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { $t = ((Get-Content build.log -Tail 40) -join '%0A'); Write-Host "::error title=Build failed::$t"; exit $code }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ditto-Pro-Setup
          path: dist/*.exe

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
