name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export-engine tests (real FFmpeg renders)
        run: npm test
        continue-on-error: true

      - name: Fetch offline speech engine (captions)
        run: pwsh -File scripts/fetch-whisper.ps1

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ditto-Pro-Setup
          path: dist/*.exe

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
